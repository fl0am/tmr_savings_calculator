# Savings calculator defaults. Change numbers here (no code changes needed), commit, and the app updates.
# "estimate" = Claude's starting guess. Replace with real TMR numbers when you have them.

[labor]
hourly_wage = 22.0          # grounds crew wage, $/hour (estimate)
manual_crew = 2             # people on a manual painting crew (estimate)
season_months = 9           # months a year the robot is used, for the PAYS 1-hour monthly minimum (estimate)

[paint]
robot_price_per_gal = 8.75      # TMR white concentrate per sprayable gallon (Paint & Pricing sheet)
manual_price_per_gal = 12.00    # what prospects pay per gallon today (estimate)
manual_paint_multiplier = 1.5   # manual painting uses this many times the robot's paint (estimate, conservative)

[pays]
install_fee = 1995              # one-time PAYS installation fee (PAYS sheet)

[models.ProX]
label = "TinyLineMarker Pro X"
purchase_price = 37750              # LIST PRICE: fill in. 0 hides payback until a rep types a price.
pays_rate = 350                 # $ per spray hour (PAYS sheet)
time_factor = 1.0               # robot times below are Pro X times

[models.Sport]
label = "TinyLineMarker Sport"
purchase_price = 21750              # LIST PRICE: fill in
pays_rate = 250                 # $ per spray hour (PAYS sheet)
time_factor = 1.28              # Sport marks an 11v11 soccer field in ~25 min vs 19.5 for Pro X (TMR website)

# Robot numbers: PAYS sheet (spray minutes, total minutes, gallons per field).
# manual_hours: hours for a crew to re-mark one field by hand (estimate; soccer and football
# follow TMR's public "2 hours" and "20 crew-hours" figures). paintings: default times painted per year.
